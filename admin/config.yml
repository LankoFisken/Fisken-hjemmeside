backend:
  name: github
  repo: LankoFisken/Fisken-hjemmeside
  branch: main
  base_url: https://fisken-cms-auth.lanko.workers.dev

media_folder: "Photoshoot 2025"
public_folder: "Photoshoot 2025"

locale: da

collections:
  - name: "indhold"
    label: "Hjemmeside indhold"
    files:
      - name: "forside"
        label: "Forside tekster"
        file: "content.json"
        fields:
          - { label: "Hero overskrift", name: "hero_titel", widget: "string" }
          - { label: "Hero undertekst", name: "hero_tekst", widget: "text" }
          - { label: "Mission overskrift", name: "mission_titel", widget: "string" }
          - { label: "Mission tekst", name: "mission_tekst", widget: "text" }
